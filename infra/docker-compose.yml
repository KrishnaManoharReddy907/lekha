name: lekha
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lekha
      POSTGRES_PASSWORD: lekha
      POSTGRES_DB: lekha
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lekha"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
