# Render Blueprint for the Lekha API (free plan).
# The website is deployed separately on Vercel; the database and file storage live on Supabase.
services:
  - type: web
    name: lekha-api
    runtime: docker
    plan: free
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LEKHA_ENV
        value: production
      - key: LEKHA_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL # Supabase → Connect → Session pooler, with +asyncpg (see docs/DEPLOY.md)
        sync: false
      - key: LEKHA_WEB_ORIGIN # e.g. https://lekha-yourname.vercel.app
        sync: false
      - key: LEKHA_PUBLIC_API_URL # same as LEKHA_WEB_ORIGIN (files are served via the site's /api proxy)
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LEKHA_STORAGE
        value: s3
      - key: S3_BUCKET
        value: lekha
      - key: S3_ENDPOINT # https://<project-ref>.supabase.co/storage/v1/s3
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      # The free instance has 512 MB RAM and a fraction of a CPU: keep parallelism small.
      - key: LEKHA_WORKER_CONCURRENCY
        value: "1"
      - key: LEKHA_OCR_PROCESSES
        value: "1"
