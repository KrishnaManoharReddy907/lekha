[project]
name = "lekha"
version = "0.1.0"
description = "Lekha — GST invoice-to-ITC protection platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.17",
  "httpx>=0.27",
  "anthropic>=0.75",
  "boto3>=1.35",
  "pillow>=11.0",
  "pillow-heif>=0.20",
  "imagehash>=4.3",
  "opencv-python-headless>=4.10",
  "numpy>=2.1",
  "scipy>=1.14",
  "rapidfuzz>=3.10",
  "networkx>=3.4",
  "pymupdf>=1.24",
  "rapidocr-onnxruntime>=1.4",
  "zxing-cpp>=2.2",
  "pyjwt>=2.9",
  "openpyxl>=3.1",
  "lxml>=5.3",
  "reportlab>=4.2",
  "slowapi>=0.1.9",
  "structlog>=24.4",
  "python-dateutil>=2.9",
  "email-validator>=2.4.0",
  "qrcode>=8.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "hypothesis>=6.118",
  "ruff>=0.8",
  "mypy>=1.13",
  "faker>=33.0",
]

[project.scripts]
lekha = "lekha.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lekha"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: requires postgres", "ai: calls the Claude API (costs money)"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
